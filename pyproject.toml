[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "skill-atlas"
version = "0.1.0"
description = "Discover AI skills in GitHub repositories and keep a local catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "PyYAML>=6.0,<7",
  "rich>=14,<15",
  "textual>=6,<7",
  "typer>=0.16,<1",
]

[project.scripts]
skill-atlas = "skill_atlas.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
