<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"historyEnabled":false,"includeIndicatorStyles":false,"timeout":35000}'>
  <title>{% block title %}Skill Atlas{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-history="false" hx-headers='{"X-Atlas-Request":"1"}'>
  <header class="topbar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">▦</span> Skill Atlas</a><span class="local-label"><span></span> Local catalog</span></header>
  <main>
    <div id="scan-feedback" role="alert"></div>
    <section id="jobs" aria-label="Scan activity" aria-live="polite">{% if jobs is defined %}{% include 'jobs.html' %}{% endif %}</section>
    {% block content %}{% endblock %}
  </main>
  <footer>Discover skills. Explore how they work.</footer>
</body>
</html>
