<dialog id="repository-remove-dialog" aria-labelledby="repository-remove-title" aria-describedby="repository-remove-name repository-remove-description">
  <div class="remove-dialog-heading">
    <span class="remove-dialog-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
    </span>
    <button type="button" data-close-removal aria-label="Close removal dialog">×</button>
  </div>
  <h2 id="repository-remove-title">Remove repository?</h2>
  <p id="repository-remove-name"></p>
  <div id="repository-remove-description">
    <p>This removes its stored skills and local stars from your catalog.</p>
    <p class="remove-dialog-note">The repository on GitHub stays untouched. You can scan it again to add it back.</p>
  </div>
  <div id="repository-remove-feedback" role="alert"></div>
  <form id="repository-remove-form">
    <div class="remove-dialog-actions">
      <button type="button" data-close-removal autofocus>Cancel</button>
      <button type="submit" class="danger">Remove repository</button>
    </div>
  </form>
</dialog>
