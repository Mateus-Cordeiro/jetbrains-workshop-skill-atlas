{% set description_id = url('skill-description', repository_url=repository.url, skill_path=skill.path) %}
<div class="skill-item{% if not document_selection %} catalog-skill-item{% endif %}">
<a class="{{ 'skill-link' if document_selection else 'catalog-skill' }}" href="{{ url('/repository', repository_url=repository.url, skill_path=skill.path, q=q) }}"
{% if document_selection %}{% if selected and selected.path == skill.path %}aria-current="true"{% endif %} data-skill-path="{{ skill.path }}" hx-get="{{ url('/fragments/document', repository_url=repository.url, skill_path=skill.path, commit_sha=skill.commit_sha) }}" hx-target="#document" hx-sync="#workspace:replace"{% endif %}>
<strong>{{ skill.name }}{% if document_selection %} <span aria-hidden="true">↗</span>{% endif %}</strong>
<p class="skill-description" id="{{ description_id }}">{{ skill.description }}</p>
</a>
<button type="button" class="description-toggle" aria-expanded="false" aria-controls="{{ description_id }}" hidden><span>Show more</span><span class="sr-only"> description for {{ skill.name }}</span></button>
<a class="similar-link" href="{{ url('/similar', repository_url=repository.url, skill_path=skill.path, q=q) }}">Find similar<span class="sr-only"> to {{ skill.name }}</span></a>
</div>
