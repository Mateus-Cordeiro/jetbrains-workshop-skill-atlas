<div class="document-toolbar"><div><strong>{{ document.skill.name }}</strong><code>{{ document.skill.path }}</code></div><div class="document-actions"><a href="{{ url('/installations', source=document.skill.repository.url ~ '|' ~ document.skill.path) }}">Install…</a>{% with skill=document.skill %}{% include 'fragments/star-toggle.html' %}{% endwith %}<a class="external-link" href="{{ document.skill.url }}" target="_blank" rel="noreferrer">View on GitHub ↗</a></div></div>
<div class="document-options"><div class="view-toggle" role="group" aria-label="Document view"><button type="button" data-view="preview" aria-pressed="true">Preview</button><button type="button" data-view="source" aria-pressed="false">Source</button></div></div>
<div id="document-preview" class="document-content">{% if rendered.frontmatter %}<details class="frontmatter"><summary>Frontmatter</summary><pre>{{ rendered.frontmatter }}</pre></details>{% endif %}<article class="markdown" hx-disable>{{ rendered.html|safe }}</article></div>
<pre id="document-source" class="document-content source" hidden>{{ document.source }}</pre>
