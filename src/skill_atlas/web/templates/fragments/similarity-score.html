<div class="similarity-score">
  <div class="score-caption" aria-hidden="true"><span>Similarity</span><span class="score-value">{{ score }}%</span></div>
  <meter class="similarity-meter {% if score >= 70 %}score-high{% elif score >= 40 %}score-medium{% else %}score-low{% endif %}"
         min="0" max="100" value="{{ score }}"
         aria-label="Similarity for {{ name }}" aria-valuetext="{{ score }}% similarity">{{ score }}%</meter>
</div>
